<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户登录与表单验证 - 实训3</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Microsoft YaHei", Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 16px;
    }
    .container {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      max-width: 900px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      padding: 28px;
      width: 100%;
      max-width: 400px;
    }
    .card h2 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
      font-size: 20px;
    }
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      font-size: 14px;
      color: #555;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }
    .form-group input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.2);
    }
    .tip {
      font-size: 12px;
      color: #999;
      margin-top: 4px;
    }
    .btn {
      width: 100%;
      padding: 11px;
      background: #667eea;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn:hover { background: #5a6fd8; }
    .result {
      margin-top: 14px;
      font-size: 14px;
      padding: 10px 12px;
      border-radius: 6px;
      display: none;
    }
    .result.ok { display: block; background: #e8f7ee; color: #1a7f37; }
    .result.err { display: block; background: #fdecea; color: #d93025; }
  </style>
</head>
<body>
  <div class="container">

    <!-- ===== 视图一：用户登录表单 ===== -->
    <div class="card">
      <h2>用户登录</h2>
      <!-- action 为提交地址，# 表示先在当前页演示；method="post" 表示以 POST 方式提交 -->
      <form id="loginForm" action="#" method="post" novalidate>
        <div class="form-group">
          <label for="loginUser">用户名：</label>
          <input type="text" id="loginUser" name="username"
                 placeholder="请输入用户名" required minlength="3" maxlength="16">
          <div class="tip">用户名长度 3~16 位</div>
        </div>

        <div class="form-group">
          <label for="loginPwd">密码：</label>
          <input type="password" id="loginPwd" name="password"
                 placeholder="请输入密码" required minlength="6" maxlength="20">
          <div class="tip">密码长度不少于 6 位</div>
        </div>

        <div class="form-group">
          <label for="loginCode">验证码：</label>
          <input type="text" id="loginCode" name="code"
                 placeholder="请输入验证码" required pattern="[0-9]{4}">
          <div class="tip">验证码为 4 位数字</div>
        </div>

        <button type="submit" class="btn">登 录</button>
        <div id="loginResult" class="result"></div>
      </form>
    </div>

    <!-- ===== 视图二：数据验证表单（注册信息） ===== -->
    <div class="card">
      <h2>注册信息验证</h2>
      <form id="regForm" action="#" method="post" novalidate>
        <div class="form-group">
          <label for="regName">姓名：</label>
          <input type="text" id="regName" name="realname"
                 placeholder="请输入真实姓名" required>
        </div>

        <div class="form-group">
          <label for="regEmail">邮箱：</label>
          <input type="email" id="regEmail" name="email"
                 placeholder="例如：abc@example.com" required>
        </div>

        <div class="form-group">
          <label for="regPhone">手机号：</label>
          <input type="tel" id="regPhone" name="phone"
                 placeholder="请输入 11 位手机号" required pattern="1[3-9][0-9]{9}">
        </div>

        <div class="form-group">
          <label for="regAge">年龄：</label>
          <input type="number" id="regAge" name="age"
                 min="18" max="60" required>
        </div>

        <div class="form-group">
          <label for="regPwd">设置密码：</label>
          <input type="password" id="regPwd" name="pwd"
                 placeholder="6~20 位密码" required minlength="6" maxlength="20">
        </div>

        <div class="form-group">
          <label for="regPwd2">确认密码：</label>
          <input type="password" id="regPwd2" name="pwd2"
                 placeholder="再次输入密码" required>
        </div>

        <button type="submit" class="btn">提交注册</button>
        <div id="regResult" class="result"></div>
      </form>
    </div>

  </div>

  <script>
    // ===== 登录表单验证 =====
    var loginForm = document.getElementById('loginForm');
    var loginResult = document.getElementById('loginResult');

    loginForm.addEventListener('submit', function (e) {
      e.preventDefault(); // 阻止表单默认跳转，先做验证演示
      var user = document.getElementById('loginUser').value.trim();
      var pwd = document.getElementById('loginPwd').value.trim();
      var code = document.getElementById('loginCode').value.trim();

      if (user === '' || pwd === '' || code === '') {
        showResult(loginResult, 'err', '请填写完整的登录信息！');
        return;
      }
      if (user.length < 3) {
        showResult(loginResult, 'err', '用户名长度不能少于 3 位！');
        return;
      }
      if (pwd.length < 6) {
        showResult(loginResult, 'err', '密码长度不能少于 6 位！');
        return;
      }
      if (!/^[0-9]{4}$/.test(code)) {
        showResult(loginResult, 'err', '验证码必须是 4 位数字！');
        return;
      }
      // 演示账号：admin / 123456，验证码任意 4 位数字
      if (user === 'admin' && pwd === '123456') {
        showResult(loginResult, 'ok', '登录成功！欢迎你，' + user + '！');
      } else {
        showResult(loginResult, 'err', '用户名或密码错误，请重试！（演示账号 admin / 密码 123456）');
      }
    });

    // ===== 注册表单验证 =====
    var regForm = document.getElementById('regForm');
    var regResult = document.getElementById('regResult');

    regForm.addEventListener('submit', function (e) {
      e.preventDefault();
      var name = document.getElementById('regName').value.trim();
      var email = document.getElementById('regEmail').value.trim();
      var phone = document.getElementById('regPhone').value.trim();
      var age = document.getElementById('regAge').value;
      var pwd = document.getElementById('regPwd').value.trim();
      var pwd2 = document.getElementById('regPwd2').value.trim();

      if (name === '') {
        showResult(regResult, 'err', '姓名不能为空！');
        return;
      }
      if (!/^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/.test(email)) {
        showResult(regResult, 'err', '邮箱格式不正确！');
        return;
      }
      if (!/^1[3-9][0-9]{9}$/.test(phone)) {
        showResult(regResult, 'err', '手机号格式不正确！');
        return;
      }
      if (age === '' || Number(age) < 18 || Number(age) > 60) {
        showResult(regResult, 'err', '年龄必须在 18~60 之间！');
        return;
      }
      if (pwd.length < 6) {
        showResult(regResult, 'err', '密码长度不能少于 6 位！');
        return;
      }
      if (pwd !== pwd2) {
        showResult(regResult, 'err', '两次输入的密码不一致！');
        return;
      }
      showResult(regResult, 'ok', '注册信息验证通过，提交成功！');
    });

    // 公共：显示提示结果
    function showResult(el, type, msg) {
      el.className = 'result ' + type;
      el.textContent = msg;
    }
  </script>
</body>
</html>
